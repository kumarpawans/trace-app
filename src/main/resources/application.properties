# Server port configuration
server.port=4317
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# OpenTelemetry configuration
otel.traces.exporter=otlp
otel.metrics.exporter=none
otel.exporter.otlp.endpoint=http://localhost:8090

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:4200
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web.cors. allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# Apply CORS to all paths
spring.web.cors.mappings[/**]. allowed-origins=http://localhost:4200
spring.web.cors.mappings[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.web. cors.mappings[/**].allowed-headers=*
spring.web.cors.mappings[/**]. allow-credentials=true
spring.web.cors.mappings[/**]. max-age=3600

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=telemetry-consumer-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.logtracing.dto.TelemetryPayload

